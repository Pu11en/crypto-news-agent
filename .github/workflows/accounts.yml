name: accounts

on:
  push:
    paths:
      - 'skills/accounts/**'
      - 'dist/accounts.skill'
      - '.github/workflows/accounts.yml'
  pull_request:
    paths:
      - 'skills/accounts/**'
      - 'dist/accounts.skill'
      - '.github/workflows/accounts.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated skill tests
        shell: bash
        env:
          TWITTER_NEWS_HOME: ${{ runner.temp }}/twitter-news
        run: python skills/accounts/scripts/run.py test
      - name: Verify pre-auth doctor
        shell: bash
        env:
          TWITTER_NEWS_HOME: ${{ runner.temp }}/twitter-news-doctor
        run: |
          python skills/accounts/scripts/run.py init --acknowledge-x-terms-risk
          python skills/accounts/scripts/run.py doctor

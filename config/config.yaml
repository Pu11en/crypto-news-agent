# Hermes Agent config for crypto-intel-pipeline-v2.
# This file is pre-seeded at /data/.hermes/config.yaml in the container.
#
# Env var interpolation: Hermes reads these values from the OS environment
# at startup, NOT via shell expansion of the YAML file. The literal strings
# ${...} below are reference names — set the real values in Railway.

# --- Provider & model ---------------------------------------------------------
provider: bai
model: deepseek-v4-pro

# Reasoning MUST be disabled for DeepSeek V4 Pro. With thinking ON the
# model returns reasoning_content, but Hermes' tool-routing layer does
# not echo it back on the next turn → HTTP 400 from the b.ai gateway.
reasoning:
  enabled: false
  effort: low

# --- Toolsets (each plugin maps to one toolset) -------------------------------
toolsets:
  - telegram        # bundled platform
  - crypto-intel    # our pipeline plugin

# --- Plugin overrides ---------------------------------------------------------
plugins:
  model-providers:
    - bai            # forces user plugin to load
  backend:
    - crypto-intel

# --- Telegram -----------------------------------------------------------------
# Telegram's allowlist and home channel are read from env vars by Hermes
# at runtime; see BAI_API_KEY / TELEGRAM_BOT_TOKEN / TELEGRAM_ALLOWED_USERS
# / TELEGRAM_HOME_CHANNEL in railway.toml.
telegram:
  bot_token_env: TELEGRAM_BOT_TOKEN
  allowed_users_env: TELEGRAM_ALLOWED_USERS
  home_channel_env: TELEGRAM_HOME_CHANNEL
  pair_with: crypto-intel
